<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TruthSense Analyst | Linguistic Verification</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>TruthSense Analyst</h1>
            <p>High-fidelity linguistic verification for editorial authenticity.</p>
        </header>

        <main>
            <div class="card">
                <div class="input-group">
                    <label for="news-input">Article Forensic Input</label>
                    <textarea id="news-input" placeholder="Paste article content for verification..."></textarea>
                </div>

                <div class="button-row">
                    <button id="analyze-btn">
                        <span class="btn-text">Execute Analysis</span>
                        <div class="loader" id="loader"></div>
                    </button>
                    <button class="secondary-btn" id="clear-btn">Reset</button>
                </div>
            </div>

            <div id="result-area" class="card">
                <!-- Analysis results injected here -->
            </div>

            <div id="analytics-dashboard">
                <div class="analytics-grid">
                    <div class="stat-item">
                        <div id="stat-total" class="stat-val">0</div>
                        <div class="stat-lbl">Processed</div>
                    </div>
                    <div class="stat-item">
                        <div id="stat-real" class="stat-val">0</div>
                        <div class="stat-lbl">Verified</div>
                    </div>
                    <div class="stat-item">
                        <div id="stat-fake" class="stat-val">0</div>
                        <div class="stat-lbl">Flagged</div>
                    </div>
                </div>

                <div class="log-section">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 1rem; align-items: center;">
                        <h3 style="font-size: 0.8rem; text-transform: uppercase; color: var(--text-dim);">Activity Log</h3>
                        <span id="reset-stats" style="font-size: 0.7rem; cursor: pointer; color: var(--danger);">Clear Data</span>
                    </div>
                    <div style="overflow-x: auto;">
                        <table>
                            <thead>
                                <tr>
                                    <th>Timestamp</th>
                                    <th>Classification</th>
                                    <th>Confidence</th>
                                </tr>
                            </thead>
                            <tbody id="activity-log"></tbody>
                        </table>
                    </div>
                    <div id="no-activity" style="text-align: center; padding: 2rem; font-size: 0.8rem; color: var(--text-dim);">No data recorded.</div>
                </div>
            </div>
        </main>

        <footer style="margin-top: 6rem; color: var(--text-dim); font-size: 0.7rem; letter-spacing: 0.05em; text-align: center;">
            EDITORIAL VERIFICATION ENGINE &bull; VERSION 2.4.0 &bull; SECURE ANALYSIS
        </footer>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
